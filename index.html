<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>WhirlWin - Online Spinner</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --primary: #ff4757;
            --dark: #2f3542;
        }
        body {
            margin: 0; display: flex; flex-direction: column; align-items: center; 
            background: var(--bg); font-family: -apple-system, sans-serif;
            touch-action: manipulation;
        }
        h1 { margin: 20px 0; color: var(--dark); font-size: 1.5rem; }

        /* 选项卡按钮适配 */
        .controls {
            display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;
            padding: 0 10px;
        }
        .tab-btn {
            padding: 8px 16px; border: none; background: white; border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s;
            font-size: 14px; color: #57606f;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        /* 转盘容器：响应式 */
        .wheel-container {
            position: relative; width: 90vw; height: 90vw; max-width: 450px; max-height: 450px;
        }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }

        /* 指针 */
        .pointer {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            transform: translate(-50%, -50%); z-index: 10; cursor: pointer;
        }
        .pointer-body {
            width: 100%; height: 100%; background: var(--dark); border-radius: 50%;
            color: white; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; border: 3px solid white;
        }
        .pointer::after {
            content: ""; position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-bottom: 25px solid var(--dark);
        }

        #result { margin-top: 30px; font-size: 1.25rem; font-weight: bold; color: var(--primary); text-align: center; height: 1.5em; }
    </style>
</head>
<body>

    <h1>WhirlWin Spinner</h1>

    <div class="controls" id="btnGroup">加载中...</div>

    <div class="wheel-container">
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
        <div class="pointer" id="spinBtn">
            <div class="pointer-body">GO!</div>
        </div>
    </div>

    <div id="result">选择模式，开启好运</div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const resultText = document.getElementById('result');
        const btnGroup = document.getElementById('btnGroup');

        let wheelConfigs = {};
        let currentKey = "";
        let currentAngle = 0;
        let isSpinning = false;

        // 加载 GitHub 上的本地 JSON
        async function init() {
            try {
                // 使用相对路径，GitHub Pages 兼容性最好
                const res = await fetch('./config.json');
                if (!res.ok) throw new Error();
                wheelConfigs = await res.json();
                
                btnGroup.innerHTML = '';
                Object.keys(wheelConfigs).forEach((key, i) => {
                    const btn = document.createElement('button');
                    btn.className = `tab-btn ${i === 0 ? 'active' : ''}`;
                    btn.innerText = wheelConfigs[key].name;
                    btn.onclick = () => switchWheel(key, btn);
                    btnGroup.appendChild(btn);
                    if(i === 0) currentKey = key;
                });
                draw();
            } catch (e) {
                resultText.innerText = "配置加载失败，请检查文件";
            }
        }

        function switchWheel(key, btn) {
            if (isSpinning) return;
            currentKey = key;
            currentAngle = 0;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            resultText.innerText = "已准备好: " + wheelConfigs[key].name;
            draw();
        }

        function draw() {
            const prizes = wheelConfigs[currentKey].prizes;
            const arc = (Math.PI * 2) / prizes.length;
            ctx.clearRect(0, 0, 800, 800);

            prizes.forEach((p, i) => {
                const angle = currentAngle + i * arc;
                ctx.beginPath();
                ctx.fillStyle = p.color;
                ctx.moveTo(400, 400);
                ctx.arc(400, 400, 380, angle, angle + arc);
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(400, 400);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(p.text, 350, 10);
                ctx.restore();
            });
        }

        document.getElementById('spinBtn').onclick = () => {
            if (isSpinning || !currentKey) return;
            isSpinning = true;
            resultText.innerText = "正在旋转...";

            const duration = 4000;
            const startAngle = currentAngle;
            const rotateAngle = Math.PI * 2 * (10 + Math.random() * 5);
            const startTime = performance.now();

            function animate(now) {
                const p = Math.min((now - startTime) / duration, 1);
                const ease = 1 - Math.pow(1 - p, 4);
                currentAngle = startAngle + rotateAngle * ease;
                draw();
                if (p < 1) requestAnimationFrame(animate);
                else {
                    isSpinning = false;
                    const prizes = wheelConfigs[currentKey].prizes;
                    const arc = (Math.PI * 2) / prizes.length;
                    const actualAngle = (currentAngle + Math.PI/2) % (Math.PI * 2);
                    const idx = prizes.length - Math.floor(actualAngle / arc) - 1;
                    const finalIdx = (idx + prizes.length) % prizes.length;
                    resultText.innerText = "🎯 结果是: " + prizes[finalIdx].text;
                }
            }
            requestAnimationFrame(animate);
        };

        init();
    </script>
</body>
</html>
