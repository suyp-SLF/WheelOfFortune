<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhirlWin - 动态配置大转盘</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #f1f2f6;
            --text-color: #2f3542;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-color);
        }

        h1 { margin-bottom: 20px; font-weight: 800; letter-spacing: 1px; }

        /* 配置切换按钮 */
        .config-controls {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 10px 24px;
            border: none;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            font-weight: bold;
            color: #747d8c;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 71, 87, 0.3);
        }

        /* 转盘容器 */
        .wheel-outer {
            position: relative;
            width: 420px;
            height: 420px;
            padding: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
