<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>幸运大转盘 - 只有你想不到</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* 指针样式 */
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 70px;
            margin-top: -45px;
            margin-left: -30px;
            cursor: pointer;
            z-index: 10;
        }

        /* 绘制指针箭头 */
        .pointer::after {
            content: "";
            position: absolute;
            top: -20px;
            left: 15px;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #ff4757;
        }

        /* 指针中心圆 */
        .pointer-circle {
            width: 60px;
            height: 60px;
            background: #ff4757;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 0 #e84118;
            user-select: none;
        }

        .result {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2f3542;
            height: 2em;
        }
    </style>
</head>
<body>

    <div class="wheel-container">
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <div class="pointer" id="spinBtn">
            <div class="pointer-circle">抽奖</div>
        </div>
    </div>

    <div class="result" id="resultText">准备好接受命运了吗？</div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('resultText');

        // 1. 配置奖项
        const prizes = [
            { text: "免单大奖", color: "#feca57" },
            { text: "谢谢参与", color: "#ff9f43" },
            { text: "50元优惠券", color: "#ff6b6b" },
            { text: "精美周边", color: "#48dbfb" },
            { text: "再来一次", color: "#1dd1a1" },
            { text: "1元红包", color: "#54a0ff" }
        ];

        const numPrizes = prizes.length;
        const arc = Math.PI * 2 / numPrizes; // 每个扇形的弧度
        let currentAngle = 0;
        let isSpinning = false;

        // 2. 绘制转盘
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            prizes.forEach((prize, i) => {
                const angle = currentAngle + i * arc;
                
                // 画扇形
                ctx.beginPath();
                ctx.fillStyle = prize.color;
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 190, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                // 画文字
                ctx.save();
                ctx.fillStyle = "white";
                ctx.font = "bold 16px Arial";
                ctx.translate(200 + Math.cos(angle + arc/2) * 140, 200 + Math.sin(angle + arc/2) * 140);
                ctx.rotate(angle + arc/2 + Math.PI/2);
                ctx.fillText(prize.text, -ctx.measureText(prize.text).width / 2, 0);
                ctx.restore();
            });
        }

        // 3. 旋转逻辑
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            resultText.innerText = "转圈圈中...";

            const spinDuration = 4000; // 旋转时间
            const startAngle = currentAngle;
            const extraSpins = 5 + Math.random() * 5; // 随机多转几圈
            const totalRotation = extraSpins * Math.PI * 2;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / spinDuration, 1);
                
                // 使用 easeOutQuad 减速曲线
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = startAngle + totalRotation * easeOut;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    determinePrize();
                }
            }
            requestAnimationFrame(animate);
        }

        // 4. 计算中奖结果
        function determinePrize() {
            // 将当前角度标准化到 0 - 2PI 之间
            const normalizedAngle = (currentAngle % (Math.PI * 2));
            // 指针在上方（1.5PI 位置），计算哪个扇形穿过了 1.5PI
            // 或者通过偏移计算：
            const winningIndex = numPrizes - Math.floor(((currentAngle + Math.PI/2) % (Math.PI * 2)) / arc) - 1;
            const finalIndex = (winningIndex + numPrizes) % numPrizes;
            
            resultText.innerText = `恭喜获得：${prizes[finalIndex].text}！`;
        }

        spinBtn.addEventListener('click', spin);
        drawWheel(); // 初始化绘制
    </script>
</body>
</html>
