<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WhirlWin - 幸运大转盘</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background: #f8f9fa; font-family: system-ui, sans-serif;
        }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        .tab-btn {
            padding: 8px 16px; border: none; background: #ddd; border-radius: 20px;
            cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background: #ff4757; color: white; }
        
        .wheel-box { position: relative; width: 400px; height: 400px; }
        canvas { width: 100%; height: 100%; }

        /* 指针 */
        .pointer {
            position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
            transform: translate(-50%, -50%); cursor: pointer; z-index: 10;
            background: #333; border-radius: 50%; color: white;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .pointer::after {
            content: ""; position: absolute; top: -20px; left: 15px;
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-bottom: 30px solid #333;
        }
        #resultText { margin-top: 30px; font-size: 1.5rem; font-weight: bold; color: #ff4757; }
    </style>
</head>
<body>

    <div class="controls" id="btnGroup"></div>

    <div class="wheel-box">
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
        <div class="pointer" id="spinBtn">GO!</div>
    </div>

    <div id="resultText">点击中间开始</div>

    <script>
        // 1. 这里就是你的“配置文件”
        const wheelConfigs = {
            "food": {
                "name": "中午吃啥",
                "prizes": [
                    { "text": "火锅", "color": "#e74c3c" },
                    { "text": "汉堡", "color": "#f1c40f" },
                    { "text": "拉面", "color": "#3498db" },
                    { "text": "沙拉", "color": "#2ecc71" },
                    { "text": "寿司", "color": "#9b59b6" },
                    { "text": "烧烤", "color": "#e67e22" }
                ]
            },
            "fun": {
                "name": "周末去哪",
                "prizes": [
                    { "text": "宅在家", "color": "#95a5a6" },
                    { "text": "看电影", "color": "#d35400" },
                    { "text": "去爬山", "color": "#27ae60" },
                    { "text": "逛街", "color": "#ff6b6b" }
                ]
            }
        };

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('resultText');
        const btnGroup = document.getElementById('btnGroup');

        let currentKey = Object.keys(wheelConfigs)[0];
        let currentAngle = 0;
        let isSpinning = false;

        // 初始化按钮
        function initButtons() {
            btnGroup.innerHTML = '';
            Object.keys(wheelConfigs).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${key === currentKey ? 'active' : ''}`;
                btn.innerText = wheelConfigs[key].name;
                btn.onclick = () => {
                    if (isSpinning) return;
                    currentKey = key;
                    currentAngle = 0;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    draw();
                };
                btnGroup.appendChild(btn);
            });
        }

        // 绘制逻辑
        function draw() {
            const prizes = wheelConfigs[currentKey].prizes;
            const num = prizes.length;
            const arc = (Math.PI * 2) / num;
            
            ctx.clearRect(0, 0, 800, 800);
            
            prizes.forEach((p, i) => {
                const angle = currentAngle + i * arc;
                
                // 画扇形
                ctx.beginPath();
                ctx.fillStyle = p.color;
                ctx.moveTo(400, 400);
                ctx.arc(400, 400, 380, angle, angle + arc);
                ctx.fill();
                ctx.stroke();

                // 写字
                ctx.save();
                ctx.translate(400, 400);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 40px Arial";
                ctx.textAlign = "right";
                ctx.fillText(p.text, 350, 15);
                ctx.restore();
            });
        }

        // 旋转逻辑
        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            
            const duration = 3000;
            const startAngle = currentAngle;
            const rotation = Math.PI * 2 * (10 + Math.random() * 5);
            const start = performance.now();

            function animate(now) {
                const p = Math.min((now - start) / duration, 1);
                const ease = 1 - Math.pow(1 - p, 3); // 减速效果
                currentAngle = startAngle + rotation * ease;
                draw();

                if (p < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    // 计算结果
                    const prizes = wheelConfigs[currentKey].prizes;
                    const arc = (Math.PI * 2) / prizes.length;
                    // 修正角度计算中奖项（指针在12点钟方向）
                    const actualAngle = (currentAngle + Math.PI/2) % (Math.PI * 2);
                    const idx = prizes.length - Math.floor(actualAngle / arc) - 1;
                    const finalIdx = (idx + prizes.length) % prizes.length;
                    resultText.innerText = "结果是：" + prizes[finalIdx].text;
                }
            }
            requestAnimationFrame(animate);
        }

        spinBtn.onclick = spin;
        initButtons();
        draw();
    </script>
</body>
</html>
